<div class="auth-page">
  <div class="auth-overlay"></div>

  <mat-card class="auth-card" appearance="outlined">
    <mat-card-header class="auth-header">
      <mat-card-title>Benvenuto</mat-card-title>
      <mat-card-subtitle>Accedi per continuare</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input
            matInput
            formControlName="username"
            autocomplete="username"
            placeholder="Inserisci username"
          />
          <mat-error *ngIf="username?.touched && username?.hasError('required')">
            Username obbligatorio
          </mat-error>
          <mat-error *ngIf="username?.touched && username?.hasError('minlength')">
            Minimo 3 caratteri
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Inserisci password"
          />

          <button
            mat-button
            type="button"
            class="toggle-btn"
            matSuffix
            (click)="hidePassword = !hidePassword"
          >
            {{ hidePassword ? 'Mostra password' : 'Nascondi' }}
          </button>

          <mat-error *ngIf="password?.touched && password?.hasError('required')">
            Password obbligatoria
          </mat-error>
          <mat-error *ngIf="password?.touched && password?.hasError('minlength')">
            Minimo 6 caratteri
          </mat-error>
        </mat-form-field>

        <a class="register-link" routerLink="/registration">
          Non sei registrato? <span class="register-cta">clicca qui.</span>
        </a>

        <button
          mat-flat-button
          color="primary"
          class="primary-btn"
          type="submit"
          [disabled]="isSubmitting"
        >
          <mat-progress-spinner
            *ngIf="isSubmitting"
            diameter="18"
            mode="indeterminate"
          ></mat-progress-spinner>

          <span [class.with-spinner]="isSubmitting">Accedi</span>
        </button>

        <mat-error *ngIf="errorMessage" class="server-error">
          {{ errorMessage }}
        </mat-error>
      </form>
    </mat-card-content>
  </mat-card>
</div>
